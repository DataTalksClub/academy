name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npx playwright install --with-deps chromium
      - name: Tests (site at /)
        run: npm test
      - name: Tests (site under /academy/)
        run: npm run test:base
      - name: Redirect site for academy.datatalks.club
        run: |
          SITE_URL=https://datatalks.club BASE_PATH=/academy/ npm run build
          node scripts/redirects.mjs dist dist-redirects https://datatalks.club/academy
          for p in index.html sessions/index.html agentic-engineering/index.html ai-engineering/index.html 404.html; do
            grep -q 'location.replace("https://datatalks.club/academy" + location.pathname + location.search + location.hash)' "dist-redirects/$p"
          done
          grep -q 'rel="canonical" href="https://datatalks.club/academy/sessions/"' dist-redirects/sessions/index.html
          grep -q 'https://datatalks.club/academy/sitemap.xml' dist/robots.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
