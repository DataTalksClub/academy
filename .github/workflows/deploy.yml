name: Publish academy changes

# datatalks.club/academy/ is built and hosted by the main site.
# Alexey t3595u: delete the old subdomain without redirects.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-main-site
  cancel-in-progress: false

jobs:
  publish-main-site:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the datatalks.club deploy
        env:
          GH_TOKEN: ${{ secrets.DTC_SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DTC_SITE_DISPATCH_TOKEN is not set; run 'Deploy site to S3' in DataTalksClub/datatalksclub.github.io to publish this academy commit."
            exit 0
          fi
          gh workflow run deploy-s3.yml -R DataTalksClub/datatalksclub.github.io --ref main
